name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: master
        fetch-depth: 0

    - name: Require tag to match master
      run: |
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$GITHUB_SHA^{commit}")" ]; then
          echo "::error::Release tag does not match master; nothing was published."
          exit 1
        fi

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Require npm publish token
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "${NODE_AUTH_TOKEN}" ]; then
          echo "::error::NPM_TOKEN repository secret is not set; nothing was published."
          exit 1
        fi

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Qualify, publish, and verify release graph
      run: pnpm run release:all
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_CONFIG_PROVENANCE: 'true'
