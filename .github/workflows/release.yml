name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Require npm publish token
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "${NODE_AUTH_TOKEN}" ]; then
          echo "::error::NPM_TOKEN repository secret is not set; nothing was published."
          exit 1
        fi

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Verify MCP docs are in sync
      run: pnpm -C packages/mcp docs:check

    - name: Verify server manifest is in sync
      run: pnpm -C packages/mcp manifest:check

    - name: Run MCP release smoke
      run: pnpm run release:smoke:mcp

    - name: Run CLI release smoke
      run: pnpm run release:smoke:cli

    - name: Publish core package to npm
      run: pnpm --filter @satori-code/core publish --access public --no-git-checks --provenance
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish mcp package to npm
      run: pnpm --filter @satori-code/mcp publish --access public --no-git-checks --provenance
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish cli package to npm
      run: pnpm --filter @satori-code/cli publish --access public --no-git-checks --provenance
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
