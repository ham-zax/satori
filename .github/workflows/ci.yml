name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core_sync_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup minimum Node.js 22.22.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @satori-code/core build

      - name: Run core integration tests
        run: pnpm --filter @satori-code/core test:integration

  lint_and_build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.22.0, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Enforce release version bumps for package-relevant changes
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.22.0'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/check-release-version-bumps.sh

      - name: Configure Windows line endings
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Validate finding status against commit ancestry
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.22.0'
        run: pnpm run findings:check

      - name: Build packages
        run: pnpm build

      - name: Verify package version references
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.22.0'
        run: pnpm run versions:check

      # `release:check` is the full release gate, but it re-runs the Core/MCP/CLI
      # unit suites that package_unit_tests already runs. Only those three suites
      # are omitted here; the script tests, the x64 Linux packed smokes, the
      # contract and manifest checks, the package scope check, and the packed
      # release graph all stay enforced.
      - name: Verify packed release graph
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.22.0'
        run: pnpm run scope:check && pnpm -C packages/mcp contract:check && pnpm -C packages/mcp manifest:check && pnpm run test:scripts && pnpm run release:smoke:mcp && pnpm run release:smoke:cli && pnpm run release:check:packed

      - name: Verify MCP docs are in sync
        run: pnpm -C packages/mcp docs:check

      # These run before the Windows clean step, which deletes dist.
      - name: Verify build outputs (Unix)
        if: matrix.os != 'windows-latest'
        run: test -f packages/core/dist/index.js && test -f packages/mcp/dist/index.js && test -f packages/cli/dist/index.js

      - name: Verify build outputs (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $outputs = @(
            "packages/core/dist/index.js",
            "packages/mcp/dist/index.js",
            "packages/cli/dist/index.js"
          )
          foreach ($output in $outputs) {
            if (-not (Test-Path $output)) {
              throw "Missing dist output: $output"
            }
          }

      - name: Test clean command (Windows validation)
        if: matrix.os == 'windows-latest'
        run: |
          pnpm clean
          echo "Clean command executed successfully on Windows"

  # Native Linux ARM64 packed-runtime acceptance. The packed closure must execute
  # on the target architecture, so this job runs the ARM-specific Potion and
  # projection tests and both packed release smokes on a native ARM runner.
  # ubuntu-24.04-arm is a GitHub-hosted ARM64 runner label
  # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners,
  # checked 2026-11-10). The existing OS/Node matrix stays unchanged.
  arm64_packed_runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup minimum Node.js 22.22.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @satori-code/core build

      - name: Build MCP runtime
        run: pnpm --filter @satori-code/mcp build:runtime

      - name: Build CLI package
        run: pnpm --filter @satori-code/cli build

      # Explicit paths keep the ARM-only Potion and bundled-addon cases executing.
      - name: Run core Potion and projection tests
        run: pnpm -C packages/core exec node --liftoff-only --import tsx --import ./src/test-state-root.ts --test --test-reporter=../../scripts/satori-test-reporter.mjs --test-concurrency=1 src/embedding/potion-embedding.test.ts src/embedding/potion-embedding-pool.test.ts src/core/native-search-projections.test.ts

      - name: Run CLI release smoke tests
        run: pnpm -C packages/cli exec node --import tsx --test --test-reporter=../../scripts/satori-test-reporter.mjs src/release-smoke.test.ts

      - name: Run MCP release smoke tests
        run: pnpm -C packages/mcp run test:release-smoke

      - name: Run packed CLI release smoke
        run: pnpm run release:smoke:cli

      - name: Run packed MCP release smoke
        run: pnpm run release:smoke:mcp

  # OWN-7: enforce package unit tests (fakes only; no live Milvus/provider network).
  # Single OS/Node cell keeps cost bounded; matrix already covers build/docs.
  package_unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The duplicated-declaration-output test resolves project references to built .d.ts files.
      - name: Build packages
        run: pnpm build

      - name: Run core unit tests
        run: pnpm --filter @satori-code/core test

      - name: Run MCP unit tests
        run: pnpm --filter @satori-code/mcp test

      - name: Run CLI unit tests
        run: pnpm --filter @satori-code/cli test
